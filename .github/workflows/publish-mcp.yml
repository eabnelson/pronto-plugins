name: Publish Pronto MCP

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify publisher
        env:
          PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/$archive.sigstore.json" --output "$archive.sigstore.json"
          printf '%s  %s\n' '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579' "$archive" | sha256sum --check
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate with this repository's GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Publish Pronto MCP metadata
        run: ./mcp-publisher publish server.json
